name: Publish showcase to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'showcase/**'
      - 'shared/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: showcase/package-lock.json
      - uses: actions/configure-pages@v5
      - run: npm ci --ignore-scripts
        working-directory: showcase
      - run: npm run build
        working-directory: showcase
      - name: Check published data boundary
        shell: python
        run: |
          from pathlib import Path
          root = Path('showcase/dist')
          assert {p.name for p in (root / 'demo').iterdir()} == {'project_data.json', 'improvement_data.json'}
          assert not any(root.rglob('*.csv'))
          assert not any(root.rglob('*.parquet'))
          assert not any(root.rglob('*.pkl'))
          assert not any(root.rglob('.env*'))
          assert not any(root.rglob('*.sqlite'))
          assert not any(root.rglob('*.key'))
          import re
          for path in root.rglob('*'):
            if path.suffix in {'.js', '.json', '.html', '.css'}:
              assert not re.search(r'sk-[A-Za-z0-9_-]{16,}', path.read_text(encoding='utf-8')), path
      - uses: actions/upload-pages-artifact@v4
        with:
          path: showcase/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
